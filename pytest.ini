[pytest]
testpaths = backend/tests
pythonpath = . backend
addopts = --strict-markers
markers =
    unit: Fast isolated tests of a single unit.
    integration: Tests that require PostgreSQL or multiple backend components.
    api: FastAPI endpoint and HTTP contract tests.
    ml: Tests that may load ML models or perform expensive inference.
    e2e: End-to-end tests spanning the complete application workflow.
