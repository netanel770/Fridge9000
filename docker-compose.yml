services:
  db:
    image: postgres:16
    container_name: fridge9000-db
    environment:
      POSTGRES_USER: fridge
      POSTGRES_PASSWORD: fridgepass
      POSTGRES_DB: fridge9000
    ports:
      - "5432:5432"
    volumes:
      - fridge9000_pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fridge -d fridge9000"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: fridge9000-backend
    env_file:
      - path: ./.env
        required: false
    environment:
      DATABASE_URL: postgresql://fridge:fridgepass@db:5432/fridge9000
      FRESHNESS_MODEL_PATH: /app/fridge9000_freshness_classifier_sanity.pt
      MODEL_TRAIN_EPOCHS: ${MODEL_TRAIN_EPOCHS:-30}
      MODEL_TRAIN_IMGSZ: ${MODEL_TRAIN_IMGSZ:-640}
      MODEL_TRAIN_BATCH: ${MODEL_TRAIN_BATCH:-8}
      MODEL_COMPARE_IMGSZ: ${MODEL_COMPARE_IMGSZ:-640}
      MODEL_COMPARE_BATCH: ${MODEL_COMPARE_BATCH:-8}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/dataset_exports:/app/dataset_exports
      - ./backend/candidate_models:/app/candidate_models
      - ./backend/model_comparisons:/app/model_comparisons

volumes:
  fridge9000_pgdata:
